name: Build and Test

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 2
        persist-credentials: false

    - name: Detect build-related changes
      id: filter
      uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
      with:
        filters: |
          relevant:
            - 'Sources/**'
            - 'Tests/**'
            - 'Fluid.xcodeproj/**'
            - 'Package.swift'
            - 'Package.resolved'
            - 'Info.plist'
            - 'Fluid.entitlements'
            - '.swiftlint.yml'
            - '.github/workflows/build.yml'
            - 'scripts/fork-sign-and-package.sh'

  lint:
    name: SwiftLint
    if: needs.changes.outputs.relevant == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        persist-credentials: false

    - name: Run SwiftLint (strict)
      run: |
        docker run --rm \
          --volume "$PWD:$PWD" \
          --workdir "$PWD" \
          ghcr.io/realm/swiftlint:0.63.2 \
          lint --strict --config .swiftlint.yml

  build:
    name: Build FluidVoice
    if: needs.changes.outputs.relevant == 'true' && needs.lint.result == 'success'
    needs: [changes, lint]
    runs-on: macos-15
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        persist-credentials: false

    - name: Install xcpretty
      run: sudo gem install xcpretty

    - name: Cache Whisper models
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/Library/Caches/WhisperModels
        key: ${{ runner.os }}-whisper-models-transcribecpp-v1

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: '26'
    
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Run fork build policy tests
      run: sh Tests/run_fork_build_policy_tests.sh

    - name: Run standalone onboarding regressions
      run: sh Tests/run_onboarding_tests.sh

    - name: Run release highlights regressions
      run: sh Tests/run_release_highlights_tests.sh

    - name: Run history decode recovery regressions
      run: sh Tests/run_history_decode_recovery_tests.sh

    - name: Run settings backup concurrency regressions
      run: python3 Tests/run_settings_backup_concurrency_tests.py

    - name: Run meeting backup refresh regressions
      run: python3 Tests/run_meeting_backup_refresh_tests.py

    # Tiny Whisper GGUF output is nondeterministic on hosted macOS runners.
    # Keep this E2E assertion in the suite for local validation, but skip it in CI.
    - name: Build and test (excluding flaky Tiny Whisper E2E)
      run: |
        set -o pipefail
        mkdir -p build/test-results
        xcodebuild test \
          -project Fluid.xcodeproj \
          -scheme Fluid \
          -destination 'platform=macOS,arch=arm64' \
          -resultBundlePath build/test-results/Fluid.xcresult \
          -onlyUsePackageVersionsFromResolvedFile \
          -disableAutomaticPackageResolution \
          -skip-testing:FluidDictationIntegrationTests/DictationE2ETests/testDictationEndToEnd_whisperTiny_transcribesFixture \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee build/test-results/xcodebuild.log | xcpretty

    - name: Collect crash reports
      if: always()
      run: |
        mkdir -p build/test-results/crashes
        find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'FluidVoice*' -exec cp {} build/test-results/crashes/ \; 2>/dev/null || true

    - name: Save test diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: macos-test-results
        path: build/test-results
        if-no-files-found: ignore
        retention-days: 7
